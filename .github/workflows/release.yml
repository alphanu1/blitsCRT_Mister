# SPDX-License-Identifier: GPL-2.0-or-later
#
# Build and release when VERSION changes.
#
# Pushing a commit that touches VERSION builds everything and publishes a
# release, with the changelog taken from the commits since the last one.
# Nothing else triggers it, so ordinary commits are free.
#
# ---------------------------------------------------------------------------
# What CI does, and does not
# ---------------------------------------------------------------------------
#
# It does not build the card. It cannot: Quartus is a ~10 GB licensed install,
# and the kernel and u-boot each need their own cross-compiler -- u-boot's being
# gcc 5, eight major versions behind everything else.
#
# So `build/` is committed. It is the whole card: bitstream, kernel, device
# tree, daemon, tools and the bootloader. `make world` produces all of it
# locally and stages it there.
#
#     make world
#     git add -A build
#     echo 0.8.22 > VERSION
#     git commit -am "release 0.8.22" && git push
#
# CI then verifies every file is present, runs the tests that need no toolchain,
# wraps build/ into a card image and publishes it. Any tag can be turned back
# into the exact card it shipped.

name: release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'VERSION'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build but do not publish'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # Everything that does not need Quartus. Runs on a hosted runner.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      full: ${{ steps.ver.outputs.full }}
      tag: ${{ steps.ver.outputs.tag }}
      exists: ${{ steps.ver.outputs.exists }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog needs history, and describe needs tags.
          fetch-depth: 0

      - name: Read the version
        id: ver
        run: |
          v=$(cat VERSION)
          full=$(make -s fullversion)
          echo "version=$v"   >> "$GITHUB_OUTPUT"
          echo "full=$full"   >> "$GITHUB_OUTPUT"
          echo "tag=v$v"      >> "$GITHUB_OUTPUT"
          # Refuse to re-release a version that already has a tag. Bumping
          # VERSION is the trigger, so a tag already existing means someone
          # pushed the same number twice.
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::warning::v$v is already tagged; not releasing again"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version $v, full $full"

      - name: Install what an image needs
        run: |
          # Only the image tools. Nothing here builds the card -- build/ is
          # committed, because CI cannot produce any of it: Quartus is a
          # licensed 10 GB install, and the kernel and u-boot each need their
          # own cross-compiler.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mtools dosfstools fdisk xz-utils file

      - name: Check the committed card is complete
        run: |
          # Every file the boot command loads, plus the bootloader. A missing
          # one produces a card that boots partway and stops, which is worse
          # than not building at all.
          fail=0
          for f in build/blitscrt.rbf \
                   build/blitscrt.txt \
                   build/blitscrt/zImage \
                   build/blitscrt/blitscrt.dtb \
                   build/blitscrt/blitscrtd \
                   build/blitscrt/blitscrt-peek \
                   build/blitscrt/gadget-setup.sh \
                   build/u-boot-with-spl.sfp; do
            if [ -s "$f" ]; then
              printf 'ok       %-36s %s\n' "$f" "$(du -h "$f" | cut -f1)"
            else
              echo "::error::missing or empty: $f"
              fail=1
            fi
          done

          if [ "$fail" != 0 ]; then
            echo ""
            echo "build/ is committed and holds the whole card. Rebuild and add it:"
            echo ""
            echo "    make world"
            echo "    git add -A build"
            echo ""
            echo "What git currently tracks in build/:"
            git ls-files build/ | sed 's/^/  /' || echo "  (nothing)"
            exit 1
          fi

          # A bitstream older than the RTL usually means a fabric change that
          # never got rebuilt. Not fatal -- a docs-only release is fine.
          newest=$(ls -t rtl/*.v rtl/mister/*.sv 2>/dev/null | head -1)
          if [ -n "$newest" ] && [ "$newest" -nt build/blitscrt.rbf ]; then
            echo "::warning::$newest is newer than build/blitscrt.rbf -- stale bitstream?"
          fi

      - name: Check the tests still pass
        run: |
          # Cheap, and needs no toolchain: iverilog elaborates the RTL and the
          # daemon tests build for the host.
          sudo apt-get install -y --no-install-recommends iverilog build-essential
          make sim
          make lint
          make -C sw test

      - name: Build the image
        run: make image

      - name: Collect what to release
        run: |
          mkdir -p dist

          # The card image is the release. Without it there is nothing worth
          # publishing, so fail rather than ship a release people cannot use.
          img=$(ls blitscrt-*.img 2>/dev/null | head -1)
          if [ -z "$img" ]; then
            echo "::error::make world produced no card image"
            echo ""
            echo "It needs all three of: the bitstream, a kernel, a bootloader."
            echo ""
            echo "build/:"
            ls -la build build/blitscrt 2>/dev/null || echo "  (none)"
            echo "bootloader:"
            ls -la "$HOME"/src/u-boot*/u-boot-with-spl.sfp 2>/dev/null || echo "  (none)"
            exit 1
          fi

          # Name it for the tag, so the asset matches the release even if the
          # build and VERSION ever disagree.
          want="blitscrt-${{ steps.ver.outputs.full }}.img"
          [ "$img" = "$want" ] || mv "$img" "$want"

          # Compressed as well as raw: the image is mostly empty FAT, so it
          # shrinks by an order of magnitude, and Etcher and Raspberry Pi Imager
          # both read .img.xz directly.
          echo "compressing $want ..."
          xz -T0 -6 -k "$want"
          mv "$want" "$want.xz" dist/

          # The build set on its own, for copying onto an existing card by hand
          # or for a MiSTer hand-off install.
          tar czf "dist/blitscrt-${{ steps.ver.outputs.full }}-buildset.tar.gz" build

          ( cd dist && sha256sum * > SHA256SUMS )

          ls -la dist/
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # -------------------------------------------------------------------------
  # The release itself.
  # -------------------------------------------------------------------------
  release:
    needs: build
    if: needs.build.outputs.exists == 'false' && !inputs.dry_run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Write the changelog
        id: log
        run: |
          # Everything since the previous tag, or the whole history if this is
          # the first release.
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$prev" ]; then
            range="$prev..HEAD"
            echo "changes since $prev"
          else
            range="HEAD"
            echo "first release; using the whole history"
          fi

          {
            echo "## What changed"
            echo ""
            # Subject lines only, as a list, newest first. Merge commits are
            # noise in a changelog.
            git log --no-merges --pretty=format:'- %s' $range
            echo ""
            echo ""
            echo "## Versions"
            echo ""
            echo '```'
            make -s versions
            echo '```'
            echo ""
            echo "## Installing"
            echo ""
            echo "Write **\`blitscrt-${{ needs.build.outputs.full }}.img\`** to a microSD"
            echo "card with Etcher, Raspberry Pi Imager or \`dd\`. Both of those read"
            echo "the \`.img.xz\` directly, so there is no need to decompress it."
            echo ""
            echo "The board boots BlitsCRT on its own: test card on the CRT, daemon"
            echo "running, ready for a host over USB. No serial console, no u-boot"
            echo "prompt, nothing to configure."
            echo ""
            echo "The \`-buildset.tar.gz\` is the same files without the card layout,"
            echo "for copying onto an existing card by hand. \`SHA256SUMS\` covers"
            echo "every asset."
            echo ""
            if [ -n "$prev" ]; then
              echo "**Full diff:** ${{ github.server_url }}/${{ github.repository }}/compare/$prev...v${{ needs.build.outputs.version }}"
            fi
          } > RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: BlitsCRT ${{ needs.build.outputs.full }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: ${{ startsWith(needs.build.outputs.version, '0.') }}
